name: build unsigned ipa

on:
  push:
    branches: [main, 'init/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: select xcode 27
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | head -n 1)
          if [ -z "$XCODE_APP" ]; then
            echo "xcode 27 was not found on this runner"
            xcodebuild -version
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: build unsigned archive
        run: |
          xcodebuild \
            -project rbit.xcodeproj \
            -scheme rbit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/rbit.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: package unsigned ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/rbit.xcarchive/Products/Applications/rbit.app" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/rbit-unsigned.ipa" Payload

      - name: upload unsigned ipa
        uses: actions/upload-artifact@v4
        with:
          name: rbit-unsigned-ipa
          path: rbit-unsigned.ipa
          if-no-files-found: error
